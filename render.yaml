services:
  - type: web
    name: sdlf-intake-pages
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sdlf-intake-db
          property: connectionString
      - key: EXPORT_EMAILS
        value: chaz@vnsfirm.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: true
      - key: SMTP_SSL
        value: false

databases:
  - name: sdlf-intake-db
    plan: basic-256mb
